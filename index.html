<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Tanks · Target Practice</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><span class="mark" aria-hidden="true">✦</span> POCKET TANKS</div><nav><button id="sound" aria-pressed="true">Sound on</button><button id="full">Fullscreen</button></nav></header>
<section class="heading"><h1>Target Practice</h1><button id="reset">↺ Reset range</button></section>
<section class="range"><div class="score"><span><i></i> PLAYER 1</span><span>PLAYER 2<i></i></span></div><canvas width="800" height="450" aria-label="Two tanks on destructible terrain"></canvas></section>
<section class="controls"><div class="weapon"><small>WEAPON</small><strong>Single Shot</strong></div><label>Angle <output id="av"></output><input id="angle" type="range" min="0" max="180"></label><label>Power <output id="pv"></output><input id="power" type="range" min="1" max="100"></label><button id="fire" disabled>Fire shot ↗</button></section><footer><span id="status" role="status">Loading range…</span><span id="count">0 shots</span></footer>
</main><script type="module" src="game.js"></script></body></html>
