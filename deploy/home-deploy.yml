name: Deploy Pocket Tanks
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: pocket-tanks-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, pocket-tanks]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the tested main revision
        run: bash deploy/install-release.sh
